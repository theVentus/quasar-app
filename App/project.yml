name: QBD
options:
  bundleIdPrefix: com.theventus
  deploymentTarget:
    iOS: "26.0"
packages:
  QBDKit:
    path: ../Packages/QBDKit
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QBD:
    type: application
    platform: iOS
    sources:
      - path: QBD
      - path: ../content/courses
        type: folder
        buildPhase: resources
    dependencies:
      - package: QBDKit
        product: CourseKit
      - package: SwiftMath
    info:
      path: QBD/Info.plist
      properties:
        CFBundleDisplayName: Quasar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - cmu-serif-500-roman.ttf
          - cmu-serif-500-italic.ttf
          - cmu-serif-700-roman.ttf
          - cmu-serif-700-italic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theventus.qbd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  QBD:
    build:
      targets:
        QBD: all
